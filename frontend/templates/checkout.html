<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="shop-body">
    <header class="topbar">
        <div class="brand-wrap">
            <div class="brand-mark">F</div>
            <div>
                <p class="brand-eyebrow">Framework</p>
                <h1 class="title">Checkout</h1>
            </div>
        </div>
        <nav class="nav" aria-label="Navegação principal">
            <a href="{{ url_for('catalog_bp.products') }}" class="nav-btn">Catálogo</a>
            <a href="{{ url_for('cart_bp.cart') }}" class="nav-btn">Carrinho</a>
            <a href="{{ url_for('checkout_bp.checkout_page') }}" class="nav-btn active">Checkout</a>
            <a href="{{ url_for('order_bp.orders') }}" class="nav-btn">Pedidos</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="hero" style="grid-template-columns: 1fr;">
            <div class="hero-copy">
                <span class="eyebrow">Finalização</span>
                <h2>Seu pedido está quase pronto.</h2>
                <p>Se o pagamento falhar, você pode continuar adicionando itens ao carrinho e tentar novamente sem perder a seleção atual.</p>
                <div class="hero-actions">
                    <a class="primary-btn" href="{{ url_for('cart_bp.cart') }}">Ir para o carrinho</a>
                    <a class="btn-back" href="{{ url_for('catalog_bp.products') }}">Voltar</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
